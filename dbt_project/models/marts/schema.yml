version: 2
models:
  - name: int_scored_transactions
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('stg_transactions'), field: event_id}
      - name: risk_level
        tests:
          - accepted_values: {values: ['LOW','MEDIUM','HIGH','CRITICAL'], config: {where: "risk_level is not null"}}
  - name: fct_transactions
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_time
        tests: [not_null]
      - name: type
        tests:
          - accepted_values: {values: ['PAYMENT','TRANSFER','CASH_OUT','DEBIT','CASH_IN']}
      - name: amount
        tests: [not_null, non_negative]
      - name: risk_level
        tests:
          - accepted_values: {values: ['LOW','MEDIUM','HIGH','CRITICAL'], config: {where: "risk_level is not null"}}
      - name: risk_score
        tests:
          - non_negative
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_merchants
    columns:
      - name: merchant_id
        tests: [unique, not_null]
  - name: fct_fraud_daily
    columns:
      - name: event_date
        tests: [unique, not_null]
      - name: txn_count
        tests: [not_null, non_negative]
      - name: fraud_count
        tests: [not_null, non_negative]
  - name: fct_risk_distribution
    columns:
      - name: event_date
        tests: [not_null]
      - name: risk_level
        tests:
          - accepted_values: {values: ['LOW','MEDIUM','HIGH','CRITICAL','UNSCORED']}
      - name: txn_count
        tests: [not_null, non_negative]
      - name: txn_volume
        tests: [not_null, non_negative]
  - name: fct_type_summary
    columns:
      - name: transaction_type
        tests:
          - unique
          - not_null
          - accepted_values: {values: ['PAYMENT','TRANSFER','CASH_OUT','DEBIT','CASH_IN']}
      - name: txn_count
        tests: [not_null, non_negative]
      - name: txn_volume
        tests: [not_null, non_negative]
      - name: fraud_count
        tests: [not_null, non_negative]
      - name: fraud_rate_pct
        tests: [not_null, non_negative]
